[tools]
# Language runtimes
rust = "latest"
zig = "latest"
bun = "latest"
denojs = "latest"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"

[tasks.build]
run = "cargo build --release"
dir = "compiler/me-wasm"

[tasks.test]
run = "cargo test"
dir = "compiler/me-wasm"

[tasks."build:lsp"]
run = "cargo build --release"
dir = "tools/lsp"

[tasks."test:lsp"]
run = "cargo test"
dir = "tools/lsp"

[tasks.lint]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --check ."

[tasks.fmt]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --write ."
